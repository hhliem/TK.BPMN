<!-- Floating AI Copilot Widget for AdminLTE 3 -->
<div id="ai-copilot-container" class="position-fixed" style="bottom: 25px; right: 25px; z-index: 1060;">
  <button id="ai-copilot-toggle" class="btn btn-primary rounded-circle shadow-lg p-3 d-flex align-items-center justify-content-center" style="width: 58px; height: 58px;">
    <i class="fas fa-robot fa-lg text-white"></i>
  </button>

  <div id="ai-copilot-window" class="card shadow-lg d-none position-absolute" style="bottom: 70px; right: 0; width: 380px; height: 520px; border-radius: 12px; overflow: hidden;">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h6 class="m-0 font-weight-bold"><i class="fas fa-brain mr-2"></i>BPMN AI Copilot (Local MCP)</h6>
      <button type="button" class="close text-white" id="ai-copilot-close">&times;</button>
    </div>
    <div class="card-body p-3 overflow-auto" id="ai-copilot-messages" style="height: 390px; background-color: #f8f9fa;">
      <div class="chat-bubble bot bg-white p-2 rounded shadow-sm mb-2 text-sm">
        Xin chào! Tôi có thể hỗ trợ thống kê số lượng đơn trình ký, kiểm tra SLA hoặc tra cứu quy chế phê duyệt nội bộ.
      </div>
    </div>
    <div class="card-footer p-2 bg-white">
      <div class="input-group">
        <input type="text" id="ai-copilot-input" class="form-control form-control-sm" placeholder="Hỏi về tiến độ đơn từ...">
        <div class="input-group-append">
          <button class="btn btn-primary btn-sm" id="ai-copilot-send"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>
